# Publishes Pipeline Insights: the **dev** extension by default (the committed overrides/dev.json),
# the **release** in the `release` mode (the manifest's own id). The publisher comes from
# `vars.EXTENSION_PUBLISHER` and the version from this run.
#
# Same shape as whatif-publish.yml, which explains each step at length: a separate workflow
# started only by hand, the whole chain re-run because nothing reaches the Marketplace
# untested, a pre-flight refusal of a taken version, a check of the VSIX manifest,
# `--no-wait-validation` with its own wait loop, and sharing as a separate step once the
# version is valid. A release runs in the `marketplace-release` environment, which waits for
# approval, always waits for validation, is never shared, and is tagged `pi-v<version>` once
# valid. `release dry run` stops a release before the upload.
#
# The local equivalent of a dev publish is pipeline-insights/tools/publish-dev; the order of a
# release, and the terminal steps that remain its fallback, are in RELEASING.md.
name: Pipeline Insights Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dev: the private dev build. release dry run: everything but the upload. release: public, after approval.'
        type: choice
        options:
          - dev
          - dev and wait for validation
          - release dry run
          - release
        default: dev
      bump:
        description: 'Which part of the newest published version goes up.'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: 'Only to override the bump, e.g. 1.0.0 for a first release (no leading v).'
        required: false

permissions:
  contents: read

# `uses:` steps ignore this, so their paths spell out the folder.
defaults:
  run:
    working-directory: pipeline-insights

# A superseded publish can leave the Marketplace holding an upload this run reports as failed.
concurrency:
  group: publish-pi
  cancel-in-progress: false

env:
  # `Stage the overrides` asserts this matches dev.json or, for a release, the manifest.
  EXTENSION_ID: ${{ startsWith(inputs.mode, 'release') && 'pipeline-insights' || 'pipeline-insights-dev' }}
  SERVICE_URL: https://marketplace.visualstudio.com/

jobs:
  publish:
    runs-on: ubuntu-latest
    # The version this run chose, which the tag job names its tag after.
    outputs:
      version: ${{ steps.v.outputs.version }}
    # Approval is set per environment, so a release gets its own; a dry run uploads nothing.
    environment: ${{ inputs.mode == 'release' && 'marketplace-release' || 'marketplace' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Refuse a release from a branch other than main
        if: inputs.mode == 'release' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release is dispatched from main, not $GITHUB_REF." && exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pipeline-insights/package-lock.json

      - name: Install
        run: npm ci

      # Blank: the newest version the Marketplace lists for this id, bumped by `bump`. A first
      # release has nothing to bump, so it has to be typed.
      - name: Resolve version
        id: v
        env:
          TFX_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          RELEASE: ${{ startsWith(inputs.mode, 'release') }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            json="$(node_modules/.bin/tfx extension show \
              --publisher "$PUBLISHER" --extension-id "$EXTENSION_ID" \
              --service-url "$SERVICE_URL" --token "$TFX_TOKEN" --json --no-color)" \
              || { echo "::error::Could not ask the Marketplace for the newest version."; exit 1; }
            version="$(printf '%s' "$json" | node -e '
              const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const vs = (d?.versions ?? []).map((v) => v.version.split(".").map(Number));
              if (vs.length === 0) {
                if (process.env.RELEASE === "true") throw new Error("never published: name the first release version");
                console.log("0.1.0");
                process.exit(0);
              }
              vs.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
              const [major, minor, patch] = vs.at(-1);
              const next = { major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] }[process.env.BUMP];
              if (!next) throw new Error(`unknown bump ${process.env.BUMP}`);
              console.error(`Newest published: ${major}.${minor}.${patch}; ${process.env.BUMP} bump.`);
              console.log(next.join("."));
            ')" || { echo "::error::Could not work out the next version from the Marketplace."; exit 1; }
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' is not MAJOR.MINOR.PATCH." && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "**$EXTENSION_ID $version**" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $version"

      - name: Refuse an already-published version
        env:
          TFX_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          out="$(node_modules/.bin/tfx extension isvalid \
            --publisher "$PUBLISHER" --extension-id "$EXTENSION_ID" \
            --version "$VERSION" --service-url "$SERVICE_URL" \
            --token "$TFX_TOKEN" --no-color 2>&1 || true)"
          if printf '%s' "$out" | grep -q 'Could not find extension version'; then
            echo "Version $VERSION is not taken. Proceeding."
          elif printf '%s\n' "$out" | grep -qE '^[[:space:]]*Valid[[:space:]]*$'; then
            echo "::error::$PUBLISHER.$EXTENSION_ID $VERSION is already published. Versions cannot be reclaimed — pick a new one."
            exit 1
          else
            echo "::error::Unexpected state for version $VERSION; refusing to publish over it."
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # dev.json supplies the dev id, name, visibility and gallery flags. A release stages no id
      # or name, so the manifest supplies both, and takes visibility and flags from this run.
      # The staged copy is gitignored.
      - name: Stage the overrides
        id: stage
        env:
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          VERSION: ${{ steps.v.outputs.version }}
          RELEASE: ${{ startsWith(inputs.mode, 'release') }}
        run: |
          node -e '
            const fs = require("fs");
            const dir = "extension";
            const e = process.env;
            let o, file;
            if (e.RELEASE === "true") {
              const m = JSON.parse(fs.readFileSync(`${dir}/vss-extension.json`, "utf8"));
              if (m.id !== e.EXTENSION_ID) throw new Error(`manifest id ${m.id} != EXTENSION_ID ${e.EXTENSION_ID}`);
              o = { public: true };
              file = "overrides/.staged-release.json";
            } else {
              o = JSON.parse(fs.readFileSync(`${dir}/overrides/dev.json`, "utf8"));
              if (o.id !== e.EXTENSION_ID) throw new Error(`dev.json id ${o.id} != EXTENSION_ID ${e.EXTENSION_ID}`);
              file = "overrides/.staged-dev.json";
            }
            o.publisher = e.PUBLISHER;
            o.version = e.VERSION;
            fs.writeFileSync(`${dir}/${file}`, JSON.stringify(o, null, 2));
            fs.appendFileSync(e.GITHUB_OUTPUT, `file=${file}\n`);
          '

      # Through `npm run`: package.mjs shells out to a bare `tfx`. It also runs the identifier
      # check over the staged build. On a runner that check has fixture names but no denylist,
      # which is why RELEASING.md runs `task denylist` before a release is dispatched.
      - name: Package
        working-directory: pipeline-insights/extension
        run: npm run package -- --overrides ${{ steps.stage.outputs.file }}

      # The manifest inside the VSIX, against what this run asked for.
      - name: Check the VSIX manifest
        id: vsix
        env:
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          VERSION: ${{ steps.v.outputs.version }}
          RELEASE: ${{ startsWith(inputs.mode, 'release') }}
        run: |
          vsix="extension/dist/${PUBLISHER}.${EXTENSION_ID}-${VERSION}.vsix"
          [ -f "$vsix" ] || { echo "::error::No VSIX at $vsix"; exit 1; }
          unzip -p "$vsix" extension.vsixmanifest | node -e '
            const xml = require("fs").readFileSync(0, "utf8");
            const e = process.env;
            const release = e.RELEASE === "true";
            const identity = xml.match(/<Identity\b[^>]*>/)?.[0] ?? "";
            const attr = (n) => identity.match(new RegExp(`\\b${n}="([^"]*)"`))?.[1];
            const name = xml.match(/<DisplayName>([^<]*)</)?.[1] ?? "";
            const flags = (xml.match(/<GalleryFlags>([^<]*)</)?.[1] ?? "").split(/\s+/).filter(Boolean);
            console.log(`${attr("Publisher")}.${attr("Id")} ${attr("Version")}, "${name}", flags: ${flags.join(" ") || "none"}`);
            const bad = [];
            for (const [k, want] of [["Publisher", e.PUBLISHER], ["Id", e.EXTENSION_ID], ["Version", e.VERSION]]) {
              if (attr(k) !== want) bad.push(`${k} is ${attr(k)}, expected ${want}`);
            }
            if (name.includes("(dev)") === release) bad.push(`display name "${name}" ${release ? "says" : "lacks"} (dev)`);
            if (flags.includes("Public") !== release) bad.push(`gallery flags ${release ? "lack" : "include"} Public`);
            for (const b of bad) console.log(`::error::${b}`);
            process.exit(bad.length ? 1 : 0);
          '
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      # Before the publish, so a dry run keeps the VSIX and a failed publish leaves it to look at.
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXTENSION_ID }}-${{ steps.v.outputs.version }}
          path: pipeline-insights/${{ steps.vsix.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish
        if: inputs.mode != 'release dry run'
        env:
          TFX_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          VSIX: ${{ steps.vsix.outputs.path }}
        run: |
          node_modules/.bin/tfx extension publish \
            --vsix "$VSIX" --service-url "$SERVICE_URL" \
            --token "$TFX_TOKEN" --no-wait-validation --no-color

      # A release always waits, so its tag marks a version that passed.
      - name: Wait for Marketplace validation
        if: inputs.mode == 'release' || inputs.mode == 'dev and wait for validation'
        env:
          TFX_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          deadline=$(( SECONDS + 900 ))
          while :; do
            out="$(node_modules/.bin/tfx extension isvalid \
              --publisher "$PUBLISHER" --extension-id "$EXTENSION_ID" \
              --version "$VERSION" --service-url "$SERVICE_URL" \
              --token "$TFX_TOKEN" --no-color 2>&1 || true)"
            if printf '%s\n' "$out" | grep -qE '^[[:space:]]*Valid[[:space:]]*$'; then
              echo "Validated: $PUBLISHER.$EXTENSION_ID $VERSION"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Validation did not complete within 15 minutes. The upload was accepted, so the version is consumed — check before retrying."
              printf '%s\n' "$out"
              exit 1
            fi
            sleep 15
          done

      - name: Share with the organisation
        if: inputs.mode == 'dev and wait for validation' && vars.EXTENSION_SHARE_WITH != ''
        env:
          TFX_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          SHARE_WITH: ${{ vars.EXTENSION_SHARE_WITH }}
        run: |
          node_modules/.bin/tfx extension share \
            --publisher "$PUBLISHER" --extension-id "$EXTENSION_ID" \
            --share-with "$SHARE_WITH" --service-url "$SERVICE_URL" \
            --token "$TFX_TOKEN" --no-color
          echo "Note: sharing is not installing. A first-time organisation still needs the extension installed."

  # Its own job so that only it can write to the repo. Runs once the release is valid, and
  # also makes the GitHub release: the Marketplace link, the commits since the previous tag that
  # touched this folder, and the VSIX.
  tag:
    needs: publish
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 5

    steps:
      # The whole history and its tags, for the release notes' list of changes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the release commit
        env:
          TAG: pi-v${{ needs.publish.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. The release is live; check which commit the tag marks."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" || {
            echo "::error::Could not push $TAG. The release is live; tag $GITHUB_SHA by hand (RELEASING.md, step 7)."
            exit 1
          }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: Pipeline Insights
          PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          VERSION: ${{ needs.publish.outputs.version }}
          ARTIFACT: ${{ env.EXTENSION_ID }}-${{ needs.publish.outputs.version }}
          PREFIX: pi-v
        run: |
          tag="$PREFIX$VERSION"
          assets=()
          if gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir "$RUNNER_TEMP/vsix"; then
            assets=("$RUNNER_TEMP"/vsix/*.vsix)
          else
            echo "::warning::Could not fetch the VSIX artifact; the release goes up without it."
          fi
          prev="$(git tag --list "$PREFIX*" --merged "$GITHUB_SHA" --sort=-v:refname | grep -vx "$tag" | head -1 || true)"
          {
            echo "**[$NAME $VERSION on the Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=$PUBLISHER.$EXTENSION_ID)**"
            if [ -n "$prev" ]; then
              printf '\n## Changes since %s\n\n' "$prev"
              git log --no-merges --format='- %s (%h)' "$prev..$GITHUB_SHA" -- .
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$tag"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "${assets[@]}" --verify-tag --title "$NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" || {
            echo "::error::Could not create the GitHub release for $tag. The release is live and tagged; create it by hand (RELEASING.md, step 7)."
            exit 1
          }
