name: Pipeline Insights
description: A bug, idea or question about Pipeline Insights.
labels: [pi]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public, so everything here can be read by anyone. Leave out your
        organisation, project, pipeline and people's names, and use placeholders such as
        `contoso` or `Platform` instead. For a security problem, use the private report link
        on the previous page.
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options:
        - Bug
        - Idea
        - Question
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened and what you expected, or what you would like and why.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For a bug. A screenshot helps, once names are blurred.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Organization settings → Extensions shows it.
