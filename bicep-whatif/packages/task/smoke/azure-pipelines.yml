# One real run of the dev task against Azure, to prove the service connection
# path. The harness cannot: its task step never runs.
#
# `operation` is the task's own: `whatIf` (the default) deploys nothing, as the
# task creates a what-if result and deletes it afterwards; `create` creates or
# updates the stack; `validate` checks it; `delete` removes it, doing to what it
# managed what `unmanage` says.
#
# `scope` picks where the stack lives. Resource-group scope uses
# `resourceGroupName`, which must exist; management-group scope needs
# `managementGroupId`, a group the connection has rights on.
#
# `template: empty` (the default) is an inline empty ARM template for the scope,
# and its stack, `bicep-whatif-smoke`, manages nothing.
#
# `template: bicep` checks out the repo and runs `smoke/bicep/<scope>.bicepparam`
# with no `templateFile`, so a compile, the compiler download, a parameters
# file naming its own template and a `@secure()` value all meet Azure. Its stack
# is `bicep-whatif-smoke-bicep`:
#   - subscription: a resource group, `rg-bicep-whatif-smoke`, holding one
#     network security group whose tag carries the stand-in secret.
#   - resourceGroup: a second security group in that resource group, so run the
#     subscription `create` first. Delete this stack before that one.
#   - managementGroup: one policy definition, never assigned, whose metadata
#     carries the stand-in secret.
# After one `create`, each what-if reports the tagged resource as a modify. At
# subscription scope the payload has never carried the secret even then
# (subscription.bicep says why), so redaction there is proven by the task's
# unit tests, not here. Clean up with `operation: delete`, `unmanage: delete`,
# resource-group and management-group stacks first.
# A step after the task fails the run if the stand-in secret appears in anything
# the task wrote.
#
# The connection is a queue-time parameter, not a committed name: this repo is
# public, and the name of a real connection does not belong in it. The pipeline
# must be allowed to use the connection, either by granting it on first run or
# by sharing the connection into this pipeline's project.
#
# The connection goes in under `azureResourceManagerConnection`, the alias, so
# a pass also proves the agent resolves it; the harness uses the canonical name.
#
# No `env:` on the task step, deliberately. Workload identity federation used to
# need SYSTEM_ACCESSTOKEN mapped in; a pass here with none is the proof that it
# no longer does.
trigger: none
pr: none

parameters:
- name: operation
  displayName: 'Operation'
  type: string
  default: whatIf
  values:
  - whatIf
  - create
  - validate
  - delete
- name: scope
  displayName: 'Scope'
  type: string
  default: subscription
  values:
  - subscription
  - resourceGroup
  - managementGroup
- name: template
  displayName: 'Template'
  type: string
  default: empty
  values:
  - empty
  - bicep
- name: serviceConnection
  displayName: 'Azure Resource Manager service connection'
  type: string
- name: location
  displayName: 'Location for the stack (not used at resource-group scope)'
  type: string
  default: centralus
- name: resourceGroupName
  displayName: 'Resource group (resource-group scope only)'
  type: string
  default: rg-bicep-whatif-smoke
- name: managementGroupId
  displayName: 'Management group id (management-group scope only)'
  type: string
  default: ''
- name: unmanage
  displayName: 'What happens to what the stack stops managing, or what a delete leaves'
  type: string
  default: detach
  values:
  - detach
  - delete
- name: pool
  displayName: 'Agent pool — default is the hosted image; pass {"name":"<pool>"} for self-hosted'
  type: object
  default:
    vmImage: ubuntu-latest

variables:
  # The empty template's schema names its scope.
  ${{ if eq(parameters.scope, 'resourceGroup') }}:
    emptySchema: 'https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#'
  ${{ elseif eq(parameters.scope, 'managementGroup') }}:
    emptySchema: 'https://schema.management.azure.com/schemas/2019-08-01/managementGroupDeploymentTemplate.json#'
  ${{ else }}:
    emptySchema: 'https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#'

stages:
- stage: WhatIf_Smoke
  displayName: 'Smoke — ${{ parameters.operation }} at ${{ parameters.scope }}, ${{ parameters.template }} template'
  jobs:
  - job: WhatIf
    pool: ${{ parameters.pool }}
    variables:
      smokeOut: '$(Agent.TempDirectory)/smoke-out'
    steps:
    - ${{ if eq(parameters.template, 'empty') }}:
      - checkout: none

      - script: |
          printf '{"$schema":"%s","contentVersion":"1.0.0.0","parameters":{},"resources":[]}\n' \
            "$(emptySchema)" > "$(Agent.TempDirectory)/empty.json"
        displayName: 'Write an empty ${{ parameters.scope }} template'

    - ${{ else }}:
      - checkout: self
        fetchDepth: 1

    - task: StackWhatIfDev@1
      displayName: 'StackWhatIfDev — ${{ parameters.operation }} at ${{ parameters.scope }}, ${{ parameters.template }} template'
      inputs:
        operation: ${{ parameters.operation }}
        azureResourceManagerConnection: ${{ parameters.serviceConnection }}
        scope: ${{ parameters.scope }}
        # Each input only where the scope and operation use it, so a pass is
        # also a run with no "is ignored" warnings.
        ${{ if eq(parameters.scope, 'resourceGroup') }}:
          resourceGroupName: ${{ parameters.resourceGroupName }}
        ${{ else }}:
          actionOnUnmanageResourceGroups: ${{ parameters.unmanage }}
        ${{ if eq(parameters.scope, 'managementGroup') }}:
          managementGroupId: ${{ parameters.managementGroupId }}
          actionOnUnmanageManagementGroups: ${{ parameters.unmanage }}
        actionOnUnmanageResources: ${{ parameters.unmanage }}
        ${{ if eq(parameters.template, 'empty') }}:
          stackId: smoke
          stackName: bicep-whatif-smoke
        ${{ else }}:
          stackId: smoke-bicep
          stackName: bicep-whatif-smoke-bicep
        ${{ if ne(parameters.operation, 'delete') }}:
          ${{ if ne(parameters.scope, 'resourceGroup') }}:
            location: ${{ parameters.location }}
          ${{ if eq(parameters.template, 'empty') }}:
            templateFile: '$(Agent.TempDirectory)/empty.json'
          ${{ else }}:
            parametersFile: '$(Build.SourcesDirectory)/bicep-whatif/packages/task/smoke/bicep/${{ parameters.scope }}.bicepparam'
          denySettingsMode: none
        outputPath: $(smokeOut)

    # The stand-in is the value in each .bicepparam. Absent from everything is the
    # pass. Present as the placeholder means it reached the payload and was
    # caught. A run whose payload never carried it proves less, so that is a
    # warning rather than a pass or a failure. So far every run has been one:
    # the subscription-scope stack what-if returns no property values, for a
    # create or a modify, and a `create` payload is the stack itself.
    # A delete writes only a sidecar, so there is nothing for the check to read.
    - ${{ if and(eq(parameters.template, 'bicep'), ne(parameters.operation, 'delete')) }}:
      - script: |
          set -eu
          secret='smoke-stand-in-5c1e9d'
          ls -l "$(smokeOut)"
          if grep -rlF -- "$secret" "$(smokeOut)"; then
            echo "##vso[task.logissue type=error]The stand-in secret is in the files above, unredacted."
            exit 1
          fi
          if grep -rqF -- '***REDACTED***' "$(smokeOut)"; then
            echo "Redacted: the stand-in reached the payload and was replaced."
          else
            echo "##vso[task.logissue type=warning]No redaction placeholder in the output: the stand-in never reached the payload, so redaction was not exercised."
          fi
        displayName: 'Check the stand-in secret was redacted'
        condition: always()
