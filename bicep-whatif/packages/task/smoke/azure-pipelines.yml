# One real run of the dev task against Azure, to prove the service connection
# path. The harness cannot: its task step never runs.
#
# `template: empty` (the default) is an inline empty ARM template. With
# `operation: whatIf` nothing is deployed: the task creates a what-if result at
# subscription scope and deletes it afterwards. With `create` it creates or
# updates a subscription-scope deployment stack, `bicep-whatif-smoke`, that
# manages no resources. The stack stays until it is deleted, e.g.
#   az stack sub delete --name bicep-whatif-smoke --action-on-unmanage detachAll
#
# `template: bicep` checks out the repo and runs `smoke/bicep/main.bicep` with
# its `.bicepparam`, so a compile, the compiler download, a parameters file and
# a `@secure()` value all meet Azure. Its stack is `bicep-whatif-smoke-bicep`,
# and with `create` it manages a resource group, `rg-bicep-whatif-smoke`,
# holding one network security group whose tag carries the stand-in secret.
# After one `create` run, each what-if reports that group as a modify. So far
# the payload has never carried the secret even then (main.bicep says why), so
# redaction itself is proven by the task's unit tests, not here. Delete all
# three with
#   az stack sub delete --name bicep-whatif-smoke-bicep --action-on-unmanage deleteAll
# A step after the task fails the run if the stand-in secret appears in anything
# the task wrote.
#
# The connection is a queue-time parameter, not a committed name: this repo is
# public, and the name of a real connection does not belong in it. The pipeline
# must be allowed to use the connection, either by granting it on first run or
# by sharing the connection into this pipeline's project.
#
# The connection goes in under `azureResourceManagerConnection`, the alias, so
# a pass also proves the agent resolves it; the harness uses the canonical name.
#
# No `env:` on the task step, deliberately. Workload identity federation used to
# need SYSTEM_ACCESSTOKEN mapped in; a pass here with none is the proof that it
# no longer does.
trigger: none
pr: none

parameters:
- name: operation
  displayName: 'Operation'
  type: string
  default: whatIf
  values:
  - whatIf
  - create
- name: template
  displayName: 'Template'
  type: string
  default: empty
  values:
  - empty
  - bicep
- name: serviceConnection
  displayName: 'Azure Resource Manager service connection'
  type: string
- name: location
  displayName: 'Location for the stack'
  type: string
  default: centralus
- name: pool
  displayName: 'Agent pool — default is the hosted image; pass {"name":"<pool>"} for self-hosted'
  type: object
  default:
    vmImage: ubuntu-latest

stages:
- stage: WhatIf_Smoke
  displayName: 'Smoke — ${{ parameters.operation }}, ${{ parameters.template }} template'
  jobs:
  - job: WhatIf
    pool: ${{ parameters.pool }}
    variables:
      smokeOut: '$(Agent.TempDirectory)/smoke-out'
    steps:
    - ${{ if eq(parameters.template, 'empty') }}:
      - checkout: none

      - script: |
          printf '%s\n' '{"$schema":"https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#","contentVersion":"1.0.0.0","parameters":{},"resources":[]}' \
            > "$(Agent.TempDirectory)/empty.json"
        displayName: 'Write an empty subscription template'

    - ${{ else }}:
      - checkout: self
        fetchDepth: 1

    - task: StackWhatIfDev@1
      displayName: 'StackWhatIfDev — ${{ parameters.operation }}, ${{ parameters.template }} template'
      inputs:
        operation: ${{ parameters.operation }}
        azureResourceManagerConnection: ${{ parameters.serviceConnection }}
        ${{ if eq(parameters.template, 'empty') }}:
          stackId: smoke
          stackName: bicep-whatif-smoke
          templateFile: '$(Agent.TempDirectory)/empty.json'
        ${{ else }}:
          stackId: smoke-bicep
          stackName: bicep-whatif-smoke-bicep
          templateFile: '$(Build.SourcesDirectory)/bicep-whatif/packages/task/smoke/bicep/main.bicep'
          parametersFile: '$(Build.SourcesDirectory)/bicep-whatif/packages/task/smoke/bicep/main.bicepparam'
        location: ${{ parameters.location }}
        actionOnUnmanageResources: detach
        actionOnUnmanageResourceGroups: detach
        denySettingsMode: none
        outputPath: $(smokeOut)

    # The stand-in is the value in main.bicepparam. Absent from everything is the
    # pass. Present as the placeholder means it reached the payload and was
    # caught. A run whose payload never carried it proves less, so that is a
    # warning rather than a pass or a failure. So far every run has been one:
    # the subscription-scope stack what-if returns no property values, for a
    # create or a modify, and a `create` payload is the stack itself.
    - ${{ if eq(parameters.template, 'bicep') }}:
      - script: |
          set -eu
          secret='smoke-stand-in-5c1e9d'
          ls -l "$(smokeOut)"
          if grep -rlF -- "$secret" "$(smokeOut)"; then
            echo "##vso[task.logissue type=error]The stand-in secret is in the files above, unredacted."
            exit 1
          fi
          if grep -rqF -- '***REDACTED***' "$(smokeOut)"; then
            echo "Redacted: the stand-in reached the payload and was replaced."
          else
            echo "##vso[task.logissue type=warning]No redaction placeholder in the output: the stand-in never reached the payload, so redaction was not exercised."
          fi
        displayName: 'Check the stand-in secret was redacted'
        condition: always()
